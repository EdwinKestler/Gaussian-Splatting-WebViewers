<!DOCTYPE html>
<html lang="en">
<head>
  <title>Gaussian Splatting: A-Frame viewer</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="gaussian-splatting.js"></script>
</head>
<body style="margin:0; background:#000;">
  <a-scene renderer="antialias: false; alpha: true; colorManagement: true;" vr-mode-ui="enabled: false">
    <a-entity
      gaussian-splatting="splatUrl: https://huggingface.co/cakewalk/splat-data/resolve/main/train.splat; downsampleFactor: 1; vertexCount: 1200000; splatPixelDiscard: 4.0; slider: true; splatColor: color"
      position="0 0 0"
      rotation="0 0 0"
    ></a-entity>
    <a-box position="-1 0.5 -2" rotation="0 45 0" color="#4CC3D9"></a-box>
    <a-sphere position="0 1.25 -4" radius="1.25" color="#EF2D5E"></a-sphere>
    <a-cylinder position="1 0.75 -2" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    <a-plane position="0 0 -3" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    <a-entity camera look-controls wasd-controls position="0 1.6 5"></a-entity>
  </a-scene>
</body>
</html>
